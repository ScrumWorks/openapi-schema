name: Code Analysis

on:
    push: null
    pull_request:
        branches:
            - master

jobs:
    code_analysis:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'

            - run: composer validate

            - uses: ramsey/composer-install@v3

            - run: composer lint
            - run: composer check-cs
            - run: composer phpstan
            - run: composer phpunit
